# CI gate: format, lint, tests, annotrace (--strict) on every supported Node,
# plus keur on the whole tree.
# @implements ADR-005.gate
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  keur:
    # libre2-10 (RE2 .so.10, which keur v0.2.0 links against) ships in Ubuntu 24.04;
    # ubuntu-latest is 26.04. Back to ubuntu-latest once keur ships static RE2.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # keur v0.2.0 release binaries link RE2 dynamically; keur main ships static
      # binaries (keur#37). Drop this step once a release with static RE2 is out.
      - name: Install RE2 runtime for keur v0.2.0
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libre2-10
      # Install only (args: version); the gate runs below so it can be asserted.
      - uses: rkristelijn/keur@ade05b4d9537b538acefb966ba83b86a1f206891 # v0.2.0
        with:
          version: v0.2.0
          args: version
      # keur check gates the staged diff against HEAD. On a clean checkout that
      # diff is empty and keur passes without looking at a file, so stage the
      # tree on an unborn (orphan) branch: every file is new, so every file is
      # checked. The grep fails the job if keur scanned nothing.
      - name: keur gate on the whole tree
        run: |
          # Explicit, so a BLOCK fails the job through the tee pipe regardless of the runner's default shell flags.
          set -euo pipefail
          git checkout --orphan keur-full-tree
          git add -A
          keur check --tier pre-push 2>&1 | tee keur.log
          grep -qE 'scanning [1-9][0-9]* staged file' keur.log
